<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="absolute top-4 left-4 z-50">
        <a href="../index.html"
            class="inline-flex items-center gap-2 text-cyan-400 hover:text-cyan-300 transition-colors bg-black/50 px-4 py-2 rounded-lg border border-cyan-900/50 font-medium backdrop-blur-sm">
            <span>←</span> Home
        </a>
    </nav>

    <!-- UI Overlay -->
    <div class="absolute bottom-4 left-4 z-50 pointer-events-none select-none">
        <div class="bg-black/60 backdrop-blur-md p-4 rounded-lg border border-cyan-900/50">
            <div class="text-xs text-cyan-300 mb-1 font-bold tracking-wider">NEURAL ENGINE</div>
            <div class="text-[10px] text-gray-400">
                Drag to Move Nodes<br>
                Double Click to Add Node
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let cx, cy;

        // Graph Data
        let nodes = [];
        let edges = [];

        // Physics Params
        const REPULSION = 1000;
        const ATTRACTION = 0.005;
        const CENTER_GRAVITY = 0.0005;
        const DAMPING = 0.9;
        const MAX_SPEED = 10;

        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = 5;
                this.isDragging = false;
                this.id = Math.random().toString(36).substr(2, 9);
            }
        }

        function init() {
            nodes = [];
            edges = [];

            // Create random nodes
            const numNodes = 50;
            for (let i = 0; i < numNodes; i++) {
                nodes.push(new Node(
                    cx + (Math.random() - 0.5) * width * 0.5,
                    cy + (Math.random() - 0.5) * height * 0.5
                ));
            }

            // Create random edges
            // Ensure connectivity? Or just random.
            for (let i = 0; i < numNodes; i++) {
                const numEdges = Math.floor(Math.random() * 3) + 1;
                for (let j = 0; j < numEdges; j++) {
                    const target = Math.floor(Math.random() * numNodes);
                    if (target !== i) {
                        // Check duplicate
                        const exists = edges.some(e =>
                            (e.source === nodes[i] && e.target === nodes[target]) ||
                            (e.source === nodes[target] && e.target === nodes[i])
                        );
                        if (!exists) {
                            edges.push({ source: nodes[i], target: nodes[target] });
                        }
                    }
                }
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();
        init();

        function updatePhysics() {
            // Repulsion (O(N^2))
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const n1 = nodes[i];
                    const n2 = nodes[j];

                    const dx = n1.x - n2.x;
                    const dy = n1.y - n2.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq) || 1;

                    const force = REPULSION / distSq;
                    const fx = (dx / dist) * force;
                    const fy = (dy / dist) * force;

                    if (!n1.isDragging) {
                        n1.vx += fx;
                        n1.vy += fy;
                    }
                    if (!n2.isDragging) {
                        n2.vx -= fx;
                        n2.vy -= fy;
                    }
                }
            }

            // Attraction (Edges)
            for (const edge of edges) {
                const n1 = edge.source;
                const n2 = edge.target;

                const dx = n2.x - n1.x;
                const dy = n2.y - n1.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Spring force: F = k * x
                const force = dist * ATTRACTION;
                const fx = (dx / dist) * force;
                const fy = (dy / dist) * force;

                if (!n1.isDragging) {
                    n1.vx += fx;
                    n1.vy += fy;
                }
                if (!n2.isDragging) {
                    n2.vx -= fx;
                    n2.vy -= fy;
                }
            }

            // Center Gravity & Update
            for (const n of nodes) {
                if (n.isDragging) continue;

                // Center pull
                const dx = cx - n.x;
                const dy = cy - n.y;
                n.vx += dx * CENTER_GRAVITY;
                n.vy += dy * CENTER_GRAVITY;

                // Damping
                n.vx *= DAMPING;
                n.vy *= DAMPING;

                // Limit speed
                const speed = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
                if (speed > MAX_SPEED) {
                    n.vx = (n.vx / speed) * MAX_SPEED;
                    n.vy = (n.vy / speed) * MAX_SPEED;
                }

                n.x += n.vx;
                n.y += n.vy;

                // Bounds (Soft)
                // if (n.x < 0) n.x = 0;
                // if (n.x > width) n.x = width;
                // if (n.y < 0) n.y = 0;
                // if (n.y > height) n.y = height;
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Draw Edges
            ctx.lineWidth = 1;
            for (const edge of edges) {
                const n1 = edge.source;
                const n2 = edge.target;

                const dx = n1.x - n2.x;
                const dy = n1.y - n2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Opacity based on distance (longer = fainter)
                const alpha = Math.max(0.05, 1 - dist / 300);

                ctx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.stroke();
            }

            // Draw Nodes
            for (const n of nodes) {
                // Degree calculation for color
                const degree = edges.filter(e => e.source === n || e.target === n).length;

                // Color: Cyan base, shift to Magenta with high degree
                // Hue: Cyan is 180, Magenta is 300.
                // Let's map degree 1-5 to 180-300?
                const t = Math.min(1, (degree - 1) / 5);
                const hue = 180 + t * 120;

                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsla(${hue}, 100%, 50%, 1)`;
                ctx.fillStyle = `hsla(${hue}, 100%, 70%, 1)`;

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius + degree, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        // Interaction
        let draggedNode = null;

        function findNode(x, y) {
            // Reverse search to pick top node
            for (let i = nodes.length - 1; i >= 0; i--) {
                const n = nodes[i];
                const dx = n.x - x;
                const dy = n.y - y;
                if (dx * dx + dy * dy < (n.radius + 10) * (n.radius + 10)) {
                    return n;
                }
            }
            return null;
        }

        window.addEventListener('mousedown', (e) => {
            const n = findNode(e.clientX, e.clientY);
            if (n) {
                draggedNode = n;
                n.isDragging = true;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (draggedNode) {
                draggedNode.x = e.clientX;
                draggedNode.y = e.clientY;
                draggedNode.vx = 0;
                draggedNode.vy = 0;
            }
        });

        window.addEventListener('mouseup', () => {
            if (draggedNode) {
                draggedNode.isDragging = false;
                draggedNode = null;
            }
        });

        window.addEventListener('dblclick', (e) => {
            // Add new node
            const newNode = new Node(e.clientX, e.clientY);
            nodes.push(newNode);

            // Connect to nearest 2 neighbors
            // Sort nodes by distance
            const sorted = nodes
                .filter(n => n !== newNode)
                .map(n => {
                    const dx = n.x - newNode.x;
                    const dy = n.y - newNode.y;
                    return { node: n, dist: dx * dx + dy * dy };
                })
                .sort((a, b) => a.dist - b.dist);

            for (let i = 0; i < Math.min(2, sorted.length); i++) {
                edges.push({ source: newNode, target: sorted[i].node });
            }
        });

        // Touch support
        window.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            const n = findNode(t.clientX, t.clientY);
            if (n) {
                draggedNode = n;
                n.isDragging = true;
            } else {
                // Double tap logic could go here, but simple tap to add?
                // Nah, stick to drag.
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (draggedNode) {
                const t = e.touches[0];
                draggedNode.x = t.clientX;
                draggedNode.y = t.clientY;
                draggedNode.vx = 0;
                draggedNode.vy = 0;
                e.preventDefault(); // Prevent scroll
            }
        });

        window.addEventListener('touchend', () => {
            if (draggedNode) {
                draggedNode.isDragging = false;
                draggedNode = null;
            }
        });

        loop();

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Goop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* The Gooey Effect Magic */
        #goo-container {
            filter: blur(20px) contrast(30);
            background-color: black;
            position: absolute;
            inset: 0;
        }

        /* Color Overlay */
        #color-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, #00f, #f0f);
            mix-blend-mode: screen;
            /* Or overlay/color-dodge */
            pointer-events: none;
        }

        canvas {
            display: block;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px white;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
            border-radius: 2px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="absolute top-4 left-4 z-50">
        <a href="../index.html"
            class="inline-flex items-center gap-2 text-white hover:text-gray-300 transition-colors bg-black/50 px-4 py-2 rounded-lg border border-white/20 font-medium backdrop-blur-sm">
            <span>←</span> Home
        </a>
    </nav>

    <!-- UI Overlay -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-50 w-full max-w-md px-4 pointer-events-auto">
        <div class="bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/10">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold tracking-wider text-gray-300">GOOEYNESS</span>
                <span id="blur-val" class="text-xs font-mono text-gray-400">20px</span>
            </div>
            <input type="range" id="blur-slider" min="10" max="40" value="20">
            <div class="mt-2 text-[10px] text-center text-gray-500">
                Move Mouse to Repel • Click to Attract
            </div>
        </div>
    </div>

    <!-- The Goo Layer -->
    <div id="goo-container">
        <canvas id="canvas"></canvas>
    </div>

    <!-- Colorization Layer -->
    <div id="color-overlay"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('goo-container');
        const slider = document.getElementById('blur-slider');
        const blurVal = document.getElementById('blur-val');

        let width, height;
        let balls = [];
        const numBalls = 20;

        // Mouse
        let mouse = { x: -1000, y: -1000, down: false };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initBalls();
        }
        window.addEventListener('resize', resize);

        class Ball {
            constructor() {
                this.r = 30 + Math.random() * 50;
                this.x = Math.random() * (width - this.r * 2) + this.r;
                this.y = Math.random() * (height - this.r * 2) + this.r;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
            }

            update() {
                // Wall Bounce
                if (this.x < this.r || this.x > width - this.r) this.vx *= -1;
                if (this.y < this.r || this.y > height - this.r) this.vy *= -1;

                // Keep in bounds
                this.x = Math.max(this.r, Math.min(width - this.r, this.x));
                this.y = Math.max(this.r, Math.min(height - this.r, this.y));

                // Mouse Interaction
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Interaction Radius
                const interactR = 200;

                if (dist < interactR) {
                    const force = (interactR - dist) / interactR;
                    const angle = Math.atan2(dy, dx);

                    // Repel or Attract
                    const dir = mouse.down ? -1 : 1;

                    this.vx += Math.cos(angle) * force * dir * 0.5;
                    this.vy += Math.sin(angle) * force * dir * 0.5;
                }

                // Friction / Speed Limit
                this.vx *= 0.99;
                this.vy *= 0.99;

                // Min speed to keep moving
                // if (Math.abs(this.vx) < 0.5) this.vx *= 1.01;

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = 'white'; // Must be white for contrast filter
                ctx.fill();
            }
        }

        function initBalls() {
            balls = [];
            for (let i = 0; i < numBalls; i++) {
                balls.push(new Ball());
            }
        }

        function loop() {
            // Clear with black (transparent for canvas, but container is black)
            // Actually, for the filter to work, we need black background and white shapes
            ctx.clearRect(0, 0, width, height);

            // Draw balls
            for (const ball of balls) {
                ball.update();
                ball.draw();
            }

            requestAnimationFrame(loop);
        }

        // UI
        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            container.style.filter = `blur(${val}px) contrast(30)`;
            blurVal.innerText = val + 'px';
        });

        // Mouse
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);

        // Touch
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        window.addEventListener('touchstart', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.down = true;
        });
        window.addEventListener('touchend', () => mouse.down = false);

        resize();
        loop();

    </script>
</body>

</html>

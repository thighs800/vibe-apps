        // Render Function
        function renderApps() {
            const grid = document.getElementById('app-grid');

            apps.forEach(app => {
                const card = document.createElement('article');
                card.className = "bg-transparent border border-border rounded-xl overflow-hidden hover:border-blue-500/50 transition-colors duration-300 flex flex-col h-full";

                // Tags HTML
                const tagsHtml = app.tags.map(tag =>
                    `<span class="px-3 py-1 text-xs font-medium rounded-full bg-slate-800 border border-slate-700 text-slate-300">
                        ${tag}
                    </span>`
                ).join('');

                card.innerHTML = `
                    <div class="aspect-video w-full overflow-hidden bg-slate-800/50 border-b border-border">
                        <img src="${app.image}" alt="${app.title}" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity duration-300">
                    </div>
                    
                    <div class="p-6 flex flex-col flex-grow">
                        <h2 class="text-xl font-bold mb-2 text-white">${app.title}</h2>
                        <p class="text-text-muted text-sm mb-6 leading-relaxed flex-grow">
                            ${app.description}
                        </p>
                        
                        <div class="flex flex-wrap gap-2 mb-8">
                            ${tagsHtml}
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 mt-auto">
                            <a href="${app.codeUrl}" target="_blank" rel="noopener noreferrer" 
                               class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg border border-border bg-transparent hover:bg-slate-800 text-sm font-medium transition-colors text-slate-300 hover:text-white group">
                                <i data-lucide="github" class="w-4 h-4"></i>
                                Code
                            </a>
                            <a href="${app.demoUrl}" 
                               class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-primary hover:bg-primary-hover text-white text-sm font-medium transition-colors shadow-lg shadow-blue-500/20">
                                <i data-lucide="external-link" class="w-4 h-4"></i>
                                Demo
                            </a>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            // Initialize Icons
            lucide.createIcons();
        }

        // Run on load
        document.addEventListener('DOMContentLoaded', renderApps);

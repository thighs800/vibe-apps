<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hex Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="absolute top-4 left-4 z-50">
        <a href="../index.html"
            class="inline-flex items-center gap-2 text-purple-400 hover:text-purple-300 transition-colors bg-black/50 px-4 py-2 rounded-lg border border-purple-900/50 font-medium backdrop-blur-sm">
            <span>←</span> Home
        </a>
    </nav>

    <!-- UI Overlay -->
    <div class="absolute bottom-4 left-4 z-50 pointer-events-none select-none">
        <div class="bg-black/60 backdrop-blur-md p-4 rounded-lg border border-purple-900/50">
            <div class="text-xs text-purple-300 mb-1 font-bold tracking-wider">HEX ENGINE</div>
            <div class="text-[10px] text-gray-400">
                Move Mouse to Ripple<br>
                Click for Explosion
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        // Hex Settings
        const hexRadius = 25;
        const hexWidth = Math.sqrt(3) * hexRadius;
        const hexHeight = 2 * hexRadius;
        // Spacing
        const xStep = hexWidth;
        const yStep = hexHeight * 0.75;

        // Grid
        let hexes = new Map(); // Key: "q,r", Value: Hex object

        class Hex {
            constructor(q, r) {
                this.q = q;
                this.r = r;
                // Calculate pixel center
                this.x = (q * hexWidth) + (r * hexWidth / 2);
                this.y = r * yStep;

                this.active = 0; // 0 to 1
                this.targetActive = 0;
                this.hue = 0;
            }

            update() {
                // Decay
                this.active *= 0.95;
                if (this.active < 0.01) this.active = 0;

                // Color cycle based on time/position
                const time = Date.now() * 0.001;
                this.hue = (time * 50 + this.x * 0.1 + this.y * 0.1) % 360;
            }

            draw() {
                // Draw Hexagon
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i + Math.PI / 6; // Pointy top
                    const px = this.x + hexRadius * Math.cos(angle);
                    const py = this.y + hexRadius * Math.sin(angle);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();

                // Stroke
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Fill if active
                if (this.active > 0.01) {
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, ${this.active})`;
                    ctx.fill();

                    // Glow stroke
                    ctx.strokeStyle = `hsla(${this.hue}, 80%, 60%, ${this.active})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        function initGrid() {
            hexes.clear();
            // Cover screen + padding
            // We need to convert screen bounds to hex coords range
            // Or just loop enough

            const cols = Math.ceil(width / hexWidth) + 2;
            const rows = Math.ceil(height / yStep) + 2;

            // Offset to center?
            // Just fill from top-left (-1, -1)

            for (let r = -2; r < rows; r++) {
                const rOffset = Math.floor(r / 2); // Axial skew
                for (let q = -rOffset - 2; q < cols - rOffset; q++) {
                    const hex = new Hex(q, r);
                    hexes.set(`${q},${r}`, hex);
                }
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initGrid();
        }
        window.addEventListener('resize', resize);
        resize();

        // Pixel to Hex conversion
        function pixelToHex(x, y) {
            const q = (Math.sqrt(3) / 3 * x - 1 / 3 * y) / hexRadius;
            const r = (2 / 3 * y) / hexRadius;
            return hexRound(q, r);
        }

        function hexRound(q, r) {
            let s = -q - r;
            let rq = Math.round(q);
            let rr = Math.round(r);
            let rs = Math.round(s);

            const q_diff = Math.abs(rq - q);
            const r_diff = Math.abs(rr - r);
            const s_diff = Math.abs(rs - s);

            if (q_diff > r_diff && q_diff > s_diff) {
                rq = -rr - rs;
            } else if (r_diff > s_diff) {
                rr = -rq - rs;
            } else {
                rs = -rq - rr;
            }
            return { q: rq, r: rr };
        }

        function triggerRipple(cx, cy, strength = 1.0) {
            // Find hex at cx, cy
            const center = pixelToHex(cx, cy);

            // Apply to neighbors? Or just set active based on distance?
            // Distance check is easier for "ripple"

            for (const hex of hexes.values()) {
                const dx = hex.x - cx;
                const dy = hex.y - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // If close, activate
                if (dist < 100) { // Radius of influence
                    hex.active = Math.min(1, hex.active + strength * (1 - dist / 100));
                }
            }
        }

        function loop() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            for (const hex of hexes.values()) {
                hex.update();
                hex.draw();
            }

            requestAnimationFrame(loop);
        }

        // Interaction
        window.addEventListener('mousemove', (e) => {
            triggerRipple(e.clientX, e.clientY, 0.3);
        });

        window.addEventListener('mousedown', (e) => {
            triggerRipple(e.clientX, e.clientY, 1.0);

            // Big explosion
            const cx = e.clientX;
            const cy = e.clientY;

            // Delayed ripple?
            // Let's just activate a larger area
            for (const hex of hexes.values()) {
                const dx = hex.x - cx;
                const dy = hex.y - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 300) {
                    hex.active = Math.min(1, hex.active + 1.0 * (1 - dist / 300));
                }
            }
        });

        // Touch
        window.addEventListener('touchmove', (e) => {
            triggerRipple(e.touches[0].clientX, e.touches[0].clientY, 0.5);
        });
        window.addEventListener('touchstart', (e) => {
            triggerRipple(e.touches[0].clientX, e.touches[0].clientY, 1.0);
        });

        loop();

    </script>
</body>

</html>

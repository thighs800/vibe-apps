<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Rain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: black;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
        }

        /* Custom Scrollbar for input if needed, though we hide overflow */
        input::placeholder {
            color: #003300;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="absolute top-4 left-4 z-50">
        <a href="../index.html"
            class="inline-flex items-center gap-2 text-green-500 hover:text-green-300 transition-colors bg-black border border-green-800 px-4 py-2 rounded font-bold shadow-[0_0_10px_rgba(0,255,0,0.2)]">
            <span>&lt;-</span> Home
        </a>
    </nav>

    <!-- Controls -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-50 flex gap-2 w-full max-w-md px-4">
        <input type="text" id="hack-input" placeholder="WAKE UP NEO..."
            class="flex-1 bg-black border border-green-700 text-green-500 px-4 py-2 focus:outline-none focus:border-green-400 focus:shadow-[0_0_15px_rgba(0,255,0,0.5)] uppercase tracking-widest">
        <button onclick="injectHack()"
            class="bg-green-900/20 hover:bg-green-900/50 text-green-500 border border-green-700 px-6 py-2 font-bold transition-all hover:shadow-[0_0_15px_rgba(0,255,0,0.5)] active:scale-95">
            HACK
        </button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Configuration
        const fontSize = 16;
        let columns = 0;
        let drops = []; // Y coordinate for each column
        let dropSpeeds = []; // Speed for each column
        let activeMessages = {}; // Map of colIndex -> { text: string, charIndex: number }

        // Katakana + Latin + Nums
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const chars = (katakana + latin).split('');

        function initMatrix() {
            columns = Math.floor(width / fontSize);
            drops = [];
            dropSpeeds = [];
            activeMessages = {};

            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100; // Start above screen randomly
                dropSpeeds[i] = Math.random() * 0.5 + 0.5; // Random speed
            }
        }

        initMatrix();

        // Hack Queue
        const messageQueue = [];

        function injectHack() {
            const input = document.getElementById('hack-input');
            const text = input.value.toUpperCase().trim();
            if (text) {
                // Split long text into multiple vertical streams if needed, or just one long one
                // Let's just push the whole text as one vertical stream
                messageQueue.push(text);
                input.value = '';

                // Visual feedback
                input.style.borderColor = '#0F0';
                setTimeout(() => input.style.borderColor = '#15803d', 200);
            }
        }

        // Allow Enter key
        document.getElementById('hack-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') injectHack();
        });

        function draw() {
            // Fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#0F0'; // Green text
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                // Determine character to draw
                let text;
                let isSpecial = false;

                // Check if this column has an active message
                if (activeMessages[i]) {
                    const msgData = activeMessages[i];
                    // Calculate which char of the message corresponds to current Y
                    // Actually, drops[i] is the *current* head position.
                    // We just draw the next char in the sequence at drops[i].

                    // But drops[i] is continuous pixel value, we need discrete steps?
                    // The standard matrix loop usually does: x = i*fontSize, y = drops[i]*fontSize.
                    // Here drops[i] is the ROW index.

                    // Let's stick to standard matrix logic: drops[i] is the number of "cells" down.

                    const charIndex = Math.floor(drops[i]) - msgData.startRow;

                    if (charIndex >= 0 && charIndex < msgData.text.length) {
                        text = msgData.text[charIndex];
                        ctx.fillStyle = '#FFF'; // White head for special text? Or just brighter green
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#0F0';
                        isSpecial = true;
                    } else if (charIndex >= msgData.text.length) {
                        // Message done, revert to random
                        delete activeMessages[i];
                        text = chars[Math.floor(Math.random() * chars.length)];
                    } else {
                        // Not reached start yet? Shouldn't happen if we set startRow correctly
                        text = chars[Math.floor(Math.random() * chars.length)];
                    }
                } else {
                    text = chars[Math.floor(Math.random() * chars.length)];
                }

                // Draw
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(text, x, y);

                // Reset shadow
                if (isSpecial) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#0F0';
                }

                // Reset drop if off screen
                if (y > height && Math.random() > 0.975) {
                    drops[i] = 0;

                    // Try to assign a message from queue
                    if (messageQueue.length > 0 && !activeMessages[i]) {
                        const msg = messageQueue.shift();
                        activeMessages[i] = {
                            text: msg,
                            startRow: 0 // Starts at top
                        };
                        // Make special drops fall slightly slower/consistent to be readable?
                        // Or just let them fall naturally.
                    }
                }

                // Increment Y
                drops[i]++;
            }
        }

        // Animation Loop
        let lastTime = 0;
        const fps = 30; // Limit FPS for classic Matrix feel
        const interval = 1000 / fps;

        function animate(time) {
            requestAnimationFrame(animate);

            const delta = time - lastTime;
            if (delta > interval) {
                draw();
                lastTime = time - (delta % interval);
            }
        }

        animate(0);

    </script>
</body>

</html>

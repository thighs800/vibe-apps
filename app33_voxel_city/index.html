<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel City</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1b2a;
            /* Dark Navy */
            color: white;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            /* Crisp pixels */
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="absolute top-4 left-4 z-50">
        <a href="../index.html"
            class="inline-flex items-center gap-2 text-yellow-400 hover:text-yellow-300 transition-colors bg-black/50 px-4 py-2 rounded-lg border border-yellow-900/50 font-medium backdrop-blur-sm">
            <span>←</span> Home
        </a>
    </nav>

    <!-- UI Overlay -->
    <div class="absolute bottom-4 left-4 z-50 pointer-events-none select-none">
        <div class="bg-black/60 backdrop-blur-md p-4 rounded-lg border border-blue-900/50">
            <div class="text-xs text-blue-300 mb-1 font-bold tracking-wider">ISOMETRIC ENGINE</div>
            <div class="text-[10px] text-gray-400">
                Click to Rebuild<br>
                Drag to Rotate View
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let cx, cy;

        // Grid Settings
        const gridSize = 20;
        const tileWidth = 40;
        const tileHeight = 20;

        // City Data
        let city = [];
        let animationProgress = 0;

        // View
        let rotationAngle = Math.PI / 4; // Start at 45 deg
        let targetRotation = Math.PI / 4;
        let isDragging = false;
        let lastMouseX = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2 + 100; // Lower center to fit tall buildings
        }
        window.addEventListener('resize', resize);
        resize();

        function generateCity() {
            city = [];
            animationProgress = 0;

            const centerX = gridSize / 2;
            const centerY = gridSize / 2;

            for (let x = 0; x < gridSize; x++) {
                for (let y = 0; y < gridSize; y++) {
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    let h = Math.max(1, (10 - dist) * 2 + Math.random() * 5);
                    if (h < 1) h = 1;

                    // Roads
                    if (x === Math.floor(centerX) || y === Math.floor(centerY)) {
                        h = 0;
                    } else if (Math.random() < 0.1) {
                        h = 0;
                    }

                    const type = Math.floor(Math.random() * 3);

                    const windows = [];
                    for (let i = 0; i < Math.floor(h); i++) {
                        windows.push(Math.random() > 0.3);
                    }

                    city.push({
                        x: x - centerX, // Store centered coords
                        y: y - centerY,
                        h: Math.floor(h),
                        type: type,
                        windows: windows,
                        color: getRandomColor(type)
                    });
                }
            }
        }

        function getRandomColor(type) {
            if (type === 0) return { r: 100, g: 100, b: 120 };
            if (type === 1) return { r: 120, g: 100, b: 100 };
            return { r: 100, g: 120, b: 100 };
        }

        function iso(x, y, z) {
            // Standard Isometric Projection
            const sx = (x - y) * tileWidth / 2;
            const sy = (x + y) * tileHeight / 2 - z * tileHeight;
            return { x: sx + cx, y: sy + cy };
        }

        function drawCube(rx, ry, h, building) {
            const currentH = h * animationProgress;

            // If height is 0 (road), draw flat tile
            const isRoad = h === 0;
            const drawH = isRoad ? 0.1 : currentH;

            // Calculate vertices
            // We need to rotate the base coordinates first
            // But we already passed rotated rx, ry.
            // Wait, iso() expects "grid coordinates" aligned with screen axes in a specific way.
            // If we rotate the world, we are feeding rotated coordinates to iso().
            // This works for the position.

            // However, the CUBE itself also rotates?
            // If we just plot a point (rx, ry), we are drawing a sprite at that location.
            // But we are drawing vector cubes.
            // The cube faces must align with the grid axes.
            // If we rotate the grid, the cube faces also rotate.
            // So we can't just use standard "Top/Left/Right" fixed polygons if the angle is arbitrary?
            // Actually, in true isometric, the camera rotates around the object.
            // The object (cube) stays aligned to world axes.
            // So the projection of the cube changes.

            // My iso() function is:
            // x axis goes down-right.
            // y axis goes down-left.
            // z axis goes up.

            // If I rotate the point (x,y) in world space to (rx, ry),
            // and then feed (rx, ry) to iso(), I am effectively rotating the object
            // but keeping the camera fixed.
            // So the cube will look like it's rotating.
            // BUT, a "cube" defined by (rx, ry) to (rx+1, ry) etc...
            // We need to draw the rotated corners of the cube.

            // Cube corners in World Space (relative to building center x,y):
            // (+0.5, +0.5), (+0.5, -0.5), etc.
            // We rotate these offsets too.

            const cos = Math.cos(rotationAngle);
            const sin = Math.sin(rotationAngle);

            // Helper to project a local point (dx, dy, dz)
            function p(dx, dy, dz) {
                // Rotate local offset
                // Original building pos is (building.x, building.y)
                // We add offset
                const wx = building.x + dx;
                const wy = building.y + dy;

                // Rotate world pos
                const rwx = wx * cos - wy * sin;
                const rwy = wx * sin + wy * cos;

                return iso(rwx, rwy, dz);
            }

            // Cube vertices (centered on tile)
            // Top face (z = drawH)
            const t0 = p(-0.5, -0.5, drawH); // Back
            const t1 = p(0.5, -0.5, drawH);  // Right
            const t2 = p(0.5, 0.5, drawH);   // Front
            const t3 = p(-0.5, 0.5, drawH);  // Left

            // Bottom face (z = 0) - we only need the visible sides
            // Which sides are visible depends on rotation?
            // Actually, if we just draw all 4 sides + top, and rely on painter's algo (sorting),
            // we might get away with it?
            // But self-occlusion (back faces) should be culled.

            // Back-face culling for a cube:
            // Top is always visible.
            // Side visible if normal points to camera.
            // Camera vector in iso is roughly (-1, -1, -1) looking towards origin?
            // Actually, simpler:
            // We can just draw the "Front" faces.
            // Which are the front faces?
            // The ones with lowest screen Y? No.
            // It depends on rotation.

            // Let's just draw the "walls" that connect the visible top vertices to bottom.
            // The outline of the top face is t0-t1-t2-t3.
            // We need to draw walls for the edges that are "front facing".
            // An edge is front facing if it's on the "bottom" of the top face on screen?
            // i.e. if we walk the perimeter, the edges with higher Y are front?

            // Let's brute force: Draw all 4 sides, but sort them? 
            // Or just draw the ones that would be visible.
            // Visible sides are those where the normal dot camera > 0.
            // Let's just draw the sides that correspond to the "front" edges of the top polygon.
            // The "Front" vertex is the one with highest Screen Y (lowest on screen).
            // Let's find the vertex with max Y.

            const verts = [t0, t1, t2, t3];
            // Find index of vertex with max Y (lowest on screen)
            let maxI = 0;
            for (let i = 1; i < 4; i++) if (verts[i].y > verts[maxI].y) maxI = i;

            // The two edges connected to maxI are the visible front faces.
            // Edges are (maxI-1) -> maxI and maxI -> (maxI+1).

            const prevI = (maxI + 3) % 4;
            const nextI = (maxI + 1) % 4;

            const base = building.color;

            // Draw walls first (behind top)
            // Wall 1: maxI -> nextI
            // We need bottom vertices
            const b_curr = p(
                (maxI === 0 ? -0.5 : maxI === 1 ? 0.5 : maxI === 2 ? 0.5 : -0.5),
                (maxI === 0 ? -0.5 : maxI === 1 ? -0.5 : maxI === 2 ? 0.5 : 0.5),
                0
            );
            const b_next = p(
                (nextI === 0 ? -0.5 : nextI === 1 ? 0.5 : nextI === 2 ? 0.5 : -0.5),
                (nextI === 0 ? -0.5 : nextI === 1 ? -0.5 : nextI === 2 ? 0.5 : 0.5),
                0
            );
            const b_prev = p(
                (prevI === 0 ? -0.5 : prevI === 1 ? 0.5 : prevI === 2 ? 0.5 : -0.5),
                (prevI === 0 ? -0.5 : prevI === 1 ? -0.5 : prevI === 2 ? 0.5 : 0.5),
                0
            );

            // Lighting
            // We can fake lighting based on face index?
            // Or just alternate colors.

            // Wall 1 (Right-ish)
            ctx.fillStyle = `rgb(${base.r - 20}, ${base.g - 20}, ${base.b - 20})`;
            ctx.beginPath();
            ctx.moveTo(verts[maxI].x, verts[maxI].y);
            ctx.lineTo(verts[nextI].x, verts[nextI].y);
            ctx.lineTo(b_next.x, b_next.y);
            ctx.lineTo(b_curr.x, b_curr.y);
            ctx.fill();

            // Wall 2 (Left-ish)
            ctx.fillStyle = `rgb(${base.r - 50}, ${base.g - 50}, ${base.b - 50})`;
            ctx.beginPath();
            ctx.moveTo(verts[prevI].x, verts[prevI].y);
            ctx.lineTo(verts[maxI].x, verts[maxI].y);
            ctx.lineTo(b_curr.x, b_curr.y);
            ctx.lineTo(b_prev.x, b_prev.y);
            ctx.fill();

            // Top Face
            ctx.fillStyle = `rgb(${base.r + 40}, ${base.g + 40}, ${base.b + 40})`;
            ctx.beginPath();
            ctx.moveTo(t0.x, t0.y);
            ctx.lineTo(t1.x, t1.y);
            ctx.lineTo(t2.x, t2.y);
            ctx.lineTo(t3.x, t3.y);
            ctx.fill();

            // Windows
            // Draw on the visible walls
            if (!isRoad && currentH > 0.5) {
                // We need to know which logical face corresponds to Wall 1 and Wall 2
                // to keep windows consistent?
                // Or just draw random windows on visible faces.
                // Since we rotate, "visible face" changes.
                // It's better if windows are attached to the building data.
                // But mapping them to the rotating faces is complex.
                // Let's just draw random windows on the visible walls for now.
                // It might "shimmer" when rotating past 90deg, but that's acceptable for this style.

                ctx.fillStyle = Math.random() > 0.5 ? '#fef08a' : '#22d3ee';

                // Simple dot windows
                for (let i = 0; i < currentH; i++) {
                    if (Math.random() > 0.7) {
                        // Random pos on Wall 1
                        const t = Math.random();
                        const wx = verts[maxI].x * (1 - t) + verts[nextI].x * t;
                        const wy = verts[maxI].y * (1 - t) + verts[nextI].y * t;
                        // Move down
                        const wy_final = wy + (b_curr.y - verts[maxI].y) * (i / currentH + 0.1);
                        ctx.fillRect(wx, wy_final, 2, 2);
                    }
                    if (Math.random() > 0.7) {
                        // Random pos on Wall 2
                        const t = Math.random();
                        const wx = verts[prevI].x * (1 - t) + verts[maxI].x * t;
                        const wy = verts[prevI].y * (1 - t) + verts[maxI].y * t;
                        const wy_final = wy + (b_curr.y - verts[maxI].y) * (i / currentH + 0.1);
                        ctx.fillRect(wx, wy_final, 2, 2);
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#0d1b2a';
            ctx.fillRect(0, 0, width, height);

            // Sort by Depth
            // Depth = projected Y of the base?
            // In iso, higher Y on screen is "closer".
            // So we draw from lowest Y (top of screen) to highest Y (bottom).
            // Let's calculate screen Y for the center of each building base.

            const cos = Math.cos(rotationAngle);
            const sin = Math.sin(rotationAngle);

            const renderList = city.map(b => {
                // Rotate world pos
                const rwx = b.x * cos - b.y * sin;
                const rwy = b.x * sin + b.y * cos;

                // Project
                const p = iso(rwx, rwy, 0);

                return {
                    ...b,
                    rx: rwx, // Rotated X (for debug/logic)
                    ry: rwy,
                    screenY: p.y
                };
            });

            // Sort: Low Y (Back) -> High Y (Front)
            renderList.sort((a, b) => a.screenY - b.screenY);

            // Draw
            for (const b of renderList) {
                drawCube(b.rx, b.ry, b.h, b);
            }
        }

        function loop() {
            // Animation
            if (animationProgress < 1) {
                animationProgress += 0.005;
                if (animationProgress > 1) animationProgress = 1;
            }

            // Smooth Rotation
            if (!isDragging) {
                // Auto rotate slowly? Or just stop.
                // rotationAngle += 0.001;
            }

            draw();
            requestAnimationFrame(loop);
        }

        // Interaction
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                rotationAngle += dx * 0.01;
                lastMouseX = e.clientX;
            }
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Click to rebuild?
        // We need to distinguish click vs drag.
        // Let's use a simple "if didn't move much" check?
        // Or just add a button.
        // Let's add a double click to rebuild.
        window.addEventListener('dblclick', () => {
            generateCity();
        });

        // Touch
        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
        });
        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const dx = e.touches[0].clientX - lastMouseX;
                rotationAngle += dx * 0.01;
                lastMouseX = e.touches[0].clientX;
            }
        });
        window.addEventListener('touchend', () => isDragging = false);

        generateCity();
        loop();

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo-Rhythm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        .bar {
            transition: height 0.1s ease-in-out;
        }
    </style>
</head>

<body class="h-screen flex flex-col items-center justify-center p-4">

    <!-- Navigation -->
    <nav class="absolute top-4 left-4 z-50">
        <a href="../index.html"
            class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition-colors bg-black/50 px-4 py-2 rounded-lg border border-gray-700 font-medium backdrop-blur-sm">
            <span>←</span> Home
        </a>
    </nav>

    <div
        class="w-full max-w-5xl bg-neutral-900/80 rounded-xl border border-neutral-800 shadow-2xl backdrop-blur-sm p-6 flex flex-col gap-6 h-[80vh]">

        <!-- Header & Controls -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
            <h1
                class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-500 to-pink-500 tracking-wider">
                ALGO-RHYTHM
            </h1>

            <div class="flex flex-wrap items-center justify-center gap-4">
                <div class="flex gap-2">
                    <button onclick="startSort('bubble')"
                        class="btn-algo px-4 py-2 bg-neutral-800 hover:bg-neutral-700 rounded border border-neutral-700 text-sm font-bold transition-colors">Bubble</button>
                    <button onclick="startSort('selection')"
                        class="btn-algo px-4 py-2 bg-neutral-800 hover:bg-neutral-700 rounded border border-neutral-700 text-sm font-bold transition-colors">Selection</button>
                    <button onclick="startSort('quick')"
                        class="btn-algo px-4 py-2 bg-neutral-800 hover:bg-neutral-700 rounded border border-neutral-700 text-sm font-bold transition-colors">Quick</button>
                </div>

                <div class="w-px h-8 bg-neutral-700 mx-2"></div>

                <button onclick="resetArray()"
                    class="px-4 py-2 bg-red-900/30 hover:bg-red-900/50 text-red-400 rounded border border-red-900/50 text-sm font-bold transition-colors">
                    Shuffle
                </button>

                <div class="flex flex-col w-32 gap-1">
                    <div class="flex justify-between text-xs text-gray-400 font-mono">
                        <span>Speed</span>
                    </div>
                    <input type="range" id="speed-slider" min="1" max="100" value="50">
                </div>
            </div>
        </div>

        <!-- Visualization Area -->
        <div id="visualizer"
            class="flex-1 flex items-end justify-center gap-[2px] bg-black/50 rounded-lg p-4 border border-white/5 relative overflow-hidden">
            <!-- Bars generated by JS -->
        </div>

        <div class="text-center text-xs text-gray-600 font-mono" id="status-text">
            Ready to sort.
        </div>

    </div>

    <script>
        // --- Audio Engine ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(value) {
            if (!audioCtx) initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // Map value (1-100) to frequency (200Hz - 1200Hz)
            const freq = 200 + (value * 10);

            osc.type = 'sine';
            osc.frequency.value = freq;

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // --- Visualizer State ---
        const container = document.getElementById('visualizer');
        const statusText = document.getElementById('status-text');
        const speedSlider = document.getElementById('speed-slider');

        let array = [];
        const arraySize = 60;
        let isSorting = false;
        let abortController = null; // To stop sorting

        function generateArray() {
            array = [];
            container.innerHTML = '';
            for (let i = 0; i < arraySize; i++) {
                const value = Math.floor(Math.random() * 100) + 1;
                array.push(value);

                const bar = document.createElement('div');
                bar.className = 'bar bg-white/80 w-full rounded-t-sm';
                bar.style.height = `${value}%`;
                bar.id = `bar-${i}`;
                container.appendChild(bar);
            }
            statusText.innerText = "Ready to sort.";
        }

        function resetArray() {
            if (isSorting) {
                // Simple reload to stop async mess
                location.reload();
                return;
            }
            generateArray();
        }

        // Helper: Sleep based on speed slider
        function sleep() {
            const val = parseInt(speedSlider.value);
            // Map 1-100 to 200ms-1ms
            // Higher value = faster = lower delay
            const delay = 200 - (val * 1.9);
            return new Promise(resolve => setTimeout(resolve, Math.max(1, delay)));
        }

        // Helper: Update Bar Color
        function setColor(index, color) {
            const bar = document.getElementById(`bar-${index}`);
            if (bar) {
                if (color === 'default') bar.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
                else if (color === 'compare') bar.style.backgroundColor = '#ef4444'; // Red
                else if (color === 'swap') bar.style.backgroundColor = '#22c55e'; // Green
                else if (color === 'sorted') bar.style.backgroundColor = '#06b6d4'; // Cyan
            }
        }

        // Helper: Swap Bars visually and in array
        async function swap(i, j) {
            playNote(array[j]); // Play sound of the value moving

            // Swap data
            let temp = array[i];
            array[i] = array[j];
            array[j] = temp;

            // Update heights
            const barI = document.getElementById(`bar-${i}`);
            const barJ = document.getElementById(`bar-${j}`);
            barI.style.height = `${array[i]}%`;
            barJ.style.height = `${array[j]}%`;

            setColor(i, 'swap');
            setColor(j, 'swap');
            await sleep();
            setColor(i, 'default');
            setColor(j, 'default');
        }

        async function startSort(type) {
            if (isSorting) return;
            isSorting = true;
            initAudio();

            // Disable buttons
            document.querySelectorAll('button').forEach(b => b.disabled = true);

            statusText.innerText = `Running ${type} sort...`;

            if (type === 'bubble') await bubbleSort();
            else if (type === 'selection') await selectionSort();
            else if (type === 'quick') await quickSort(0, array.length - 1);

            // Finish animation
            for (let i = 0; i < array.length; i++) {
                setColor(i, 'sorted');
                playNote(array[i]);
                await new Promise(r => setTimeout(r, 10));
            }

            statusText.innerText = "Sorted!";
            isSorting = false;
            document.querySelectorAll('button').forEach(b => b.disabled = false);
        }

        // --- Algorithms ---

        async function bubbleSort() {
            for (let i = 0; i < array.length; i++) {
                for (let j = 0; j < array.length - i - 1; j++) {
                    setColor(j, 'compare');
                    setColor(j + 1, 'compare');
                    playNote(array[j]);
                    await sleep();

                    if (array[j] > array[j + 1]) {
                        await swap(j, j + 1);
                    }

                    setColor(j, 'default');
                    setColor(j + 1, 'default');
                }
            }
        }

        async function selectionSort() {
            for (let i = 0; i < array.length; i++) {
                let minIdx = i;
                setColor(i, 'compare');

                for (let j = i + 1; j < array.length; j++) {
                    setColor(j, 'compare');
                    playNote(array[j]);
                    await sleep();

                    if (array[j] < array[minIdx]) {
                        if (minIdx !== i) setColor(minIdx, 'default');
                        minIdx = j;
                        setColor(minIdx, 'swap'); // Highlight new min
                    } else {
                        setColor(j, 'default');
                    }
                }

                if (minIdx !== i) {
                    await swap(i, minIdx);
                }
                setColor(i, 'default'); // Will be marked sorted at end
                if (minIdx !== i) setColor(minIdx, 'default');
            }
        }

        async function quickSort(low, high) {
            if (low < high) {
                let pi = await partition(low, high);
                await quickSort(low, pi - 1);
                await quickSort(pi + 1, high);
            }
        }

        async function partition(low, high) {
            let pivot = array[high];
            setColor(high, 'swap'); // Pivot

            let i = (low - 1);

            for (let j = low; j <= high - 1; j++) {
                setColor(j, 'compare');
                playNote(array[j]);
                await sleep();

                if (array[j] < pivot) {
                    i++;
                    await swap(i, j);
                }
                setColor(j, 'default');
            }
            await swap(i + 1, high);
            setColor(high, 'default');
            return (i + 1);
        }

        // Init
        generateArray();

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Sorter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #111;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        #scanline {
            position: fixed;
            /* Fixed to viewport to match getBoundingClientRect */
            background-color: rgba(0, 255, 0, 0.5);
            box-shadow: 0 0 15px #00ff00;
            pointer-events: none;
            display: none;
            z-index: 20;
            mix-blend-mode: overlay;
        }

        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ff00;
            padding: 20px;
            border-radius: 4px;
            display: flex;
            gap: 24px;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 30;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }

        input[type="range"] {
            accent-color: #00ff00;
            cursor: pointer;
        }

        select {
            cursor: pointer;
            outline: none;
        }

        button {
            background: #00ff00;
            color: black;
            border: none;
            padding: 8px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        button:hover {
            background: #ccffcc;
            box-shadow: 0 0 15px #00ff00;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="absolute top-4 left-4 z-50">
        <a href="../index.html"
            class="inline-flex items-center gap-2 text-green-400 hover:text-green-300 transition-colors bg-black/50 px-4 py-2 rounded-lg border border-green-900/50 font-medium backdrop-blur-sm">
            <span>←</span> Home
        </a>
    </nav>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="scanline"></div>
    </div>

    <div class="ui-panel">
        <div class="flex flex-col gap-1">
            <label class="text-xs text-green-400 font-bold tracking-widest">THRESHOLD</label>
            <input type="range" id="threshold" min="0" max="255" value="100">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs text-green-400 font-bold tracking-widest">DIRECTION</label>
            <select id="direction" class="bg-black text-green-400 border border-green-400 p-1 text-sm font-mono">
                <option value="horizontal">HORIZONTAL</option>
                <option value="vertical">VERTICAL</option>
            </select>
        </div>

        <div class="file-input-wrapper">
            <button>UPLOAD IMG</button>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <button id="glitchBtn">GLITCH!</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const scanlineDiv = document.getElementById('scanline');
        const thresholdInput = document.getElementById('threshold');
        const directionSelect = document.getElementById('direction');
        const glitchBtn = document.getElementById('glitchBtn');
        const fileInput = document.getElementById('fileInput');

        let img = new Image();
        let isProcessing = false;
        let scanLine = 0;
        let originalImageData = null;

        // Load default image
        img.crossOrigin = "Anonymous";
        img.src = "https://picsum.photos/800/600";
        img.onload = () => {
            initCanvas();
        };

        function initCanvas() {
            resizeCanvas();
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            isProcessing = false;
            scanlineDiv.style.display = 'none';
        }

        function resizeCanvas() {
            // Fit image to screen but keep aspect ratio
            const aspect = img.width / img.height;
            const screenAspect = window.innerWidth / window.innerHeight;

            if (aspect > screenAspect) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerWidth / aspect;
            } else {
                canvas.height = window.innerHeight;
                canvas.width = window.innerHeight * aspect;
            }
            // Flexbox handles centering, no manual margin needed
        }

        window.addEventListener('resize', () => {
            // Re-init on resize to prevent distortion
            if (img.src) {
                initCanvas();
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    img = new Image();
                    img.onload = () => {
                        initCanvas();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        glitchBtn.addEventListener('click', () => {
            if (isProcessing) return;

            // Reset to original before starting new glitch
            if (originalImageData) {
                ctx.putImageData(originalImageData, 0, 0);
            } else {
                originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }

            isProcessing = true;
            scanLine = 0;
            scanlineDiv.style.display = 'block';
            processGlitch();
        });

        function getBrightness(r, g, b) {
            return 0.299 * r + 0.587 * g + 0.114 * b;
        }

        function processGlitch() {
            if (!isProcessing) return;

            const width = canvas.width;
            const height = canvas.height;
            const threshold = parseInt(thresholdInput.value);
            const isVertical = directionSelect.value === 'vertical';

            const speed = 15; // Slightly faster
            const max = isVertical ? width : height;

            if (scanLine >= max) {
                isProcessing = false;
                scanlineDiv.style.display = 'none';
                return;
            }

            let imageData, data, startX, startY, chunkW, chunkH;

            if (isVertical) {
                startX = scanLine;
                startY = 0;
                chunkW = Math.min(speed, width - scanLine);
                chunkH = height;
            } else {
                startX = 0;
                startY = scanLine;
                chunkW = width;
                chunkH = Math.min(speed, height - scanLine);
            }

            imageData = ctx.getImageData(startX, startY, chunkW, chunkH);
            data = imageData.data;

            // Update Scanline UI Position
            const rect = canvas.getBoundingClientRect();
            const scaleX = rect.width / width;
            const scaleY = rect.height / height;

            if (isVertical) {
                scanlineDiv.style.width = (speed * scaleX) + 'px';
                scanlineDiv.style.height = rect.height + 'px';
                scanlineDiv.style.left = (rect.left + scanLine * scaleX) + 'px';
                scanlineDiv.style.top = rect.top + 'px';
            } else {
                scanlineDiv.style.width = rect.width + 'px';
                scanlineDiv.style.height = (speed * scaleY) + 'px';
                scanlineDiv.style.left = rect.left + 'px';
                scanlineDiv.style.top = (rect.top + scanLine * scaleY) + 'px';
            }

            if (isVertical) {
                // Sorting Columns in the chunk
                for (let x = 0; x < chunkW; x++) {
                    let y = 0;
                    while (y < chunkH) {
                        const startY = y;
                        const idx = (y * chunkW + x) * 4;
                        const b = getBrightness(data[idx], data[idx + 1], data[idx + 2]);

                        if (b > threshold) {
                            let endY = y;
                            while (endY < chunkH) {
                                const eIdx = (endY * chunkW + x) * 4;
                                const eb = getBrightness(data[eIdx], data[eIdx + 1], data[eIdx + 2]);
                                if (eb <= threshold) break;
                                endY++;
                            }

                            const pixels = [];
                            for (let k = startY; k < endY; k++) {
                                const pIdx = (k * chunkW + x) * 4;
                                pixels.push({
                                    r: data[pIdx],
                                    g: data[pIdx + 1],
                                    b: data[pIdx + 2],
                                    a: data[pIdx + 3],
                                    br: getBrightness(data[pIdx], data[pIdx + 1], data[pIdx + 2])
                                });
                            }

                            pixels.sort((a, b) => a.br - b.br);

                            for (let k = startY; k < endY; k++) {
                                const pIdx = (k * chunkW + x) * 4;
                                const p = pixels[k - startY];
                                data[pIdx] = p.r;
                                data[pIdx + 1] = p.g;
                                data[pIdx + 2] = p.b;
                                data[pIdx + 3] = p.a;
                            }

                            y = endY;
                        } else {
                            y++;
                        }
                    }
                }
            } else {
                // Sorting Rows in the chunk
                for (let y = 0; y < chunkH; y++) {
                    let x = 0;
                    while (x < chunkW) {
                        const startX = x;
                        const idx = (y * chunkW + x) * 4;
                        const b = getBrightness(data[idx], data[idx + 1], data[idx + 2]);

                        if (b > threshold) {
                            let endX = x;
                            while (endX < chunkW) {
                                const eIdx = (y * chunkW + endX) * 4;
                                const eb = getBrightness(data[eIdx], data[eIdx + 1], data[eIdx + 2]);
                                if (eb <= threshold) break;
                                endX++;
                            }

                            const pixels = [];
                            for (let k = startX; k < endX; k++) {
                                const pIdx = (y * chunkW + k) * 4;
                                pixels.push({
                                    r: data[pIdx],
                                    g: data[pIdx + 1],
                                    b: data[pIdx + 2],
                                    a: data[pIdx + 3],
                                    br: getBrightness(data[pIdx], data[pIdx + 1], data[pIdx + 2])
                                });
                            }

                            pixels.sort((a, b) => a.br - b.br);

                            for (let k = startX; k < endX; k++) {
                                const pIdx = (y * chunkW + k) * 4;
                                const p = pixels[k - startX];
                                data[pIdx] = p.r;
                                data[pIdx + 1] = p.g;
                                data[pIdx + 2] = p.b;
                                data[pIdx + 3] = p.a;
                            }

                            x = endX;
                        } else {
                            x++;
                        }
                    }
                }
            }

            ctx.putImageData(imageData, startX, startY);

            scanLine += speed;
            requestAnimationFrame(processGlitch);
        }

    </script>
</body>

</html>

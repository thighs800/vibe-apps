<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Bubble Wrap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bubble-base': '#e2e8f0',
                        'bubble-highlight': '#f8fafc',
                        'bubble-shadow': '#94a3b8',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .bubble {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.4) 20%, rgba(148, 163, 184, 0.1) 50%, rgba(148, 163, 184, 0.4) 100%);
            box-shadow:
                inset 2px 2px 5px rgba(255, 255, 255, 0.8),
                inset -2px -2px 5px rgba(0, 0, 0, 0.1),
                5px 5px 10px rgba(0, 0, 0, 0.1),
                -2px -2px 10px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.1s ease-out;
            position: relative;
            overflow: hidden;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 25%;
            height: 15%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            transform: rotate(-45deg);
            filter: blur(1px);
        }

        .bubble:active {
            transform: scale(0.95);
        }

        .bubble.popped {
            background: radial-gradient(circle at 50% 50%, rgba(203, 213, 225, 0.6) 0%, rgba(148, 163, 184, 0.2) 100%);
            box-shadow:
                inset 2px 2px 5px rgba(0, 0, 0, 0.1),
                inset -1px -1px 2px rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
            cursor: default;
        }

        .bubble.popped::before {
            opacity: 0.3;
        }

        @keyframes pop-anim {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(0.95);
            }
        }

        .popped-anim {
            animation: pop-anim 0.1s ease-out forwards;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Navigation -->
    <nav class="absolute top-4 left-4 z-10">
        <a href="../index.html"
            class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 transition-colors bg-white px-4 py-2 rounded-lg shadow-sm hover:shadow-md border border-slate-200 font-medium">
            <span>←</span> Home
        </a>
    </nav>

    <main class="flex flex-col items-center gap-8">
        <h1 class="text-3xl md:text-4xl font-bold text-slate-700 tracking-tight">Virtual Bubble Wrap</h1>

        <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-100">
            <div id="bubble-grid" class="grid grid-cols-6 gap-4 p-2 bg-slate-50 rounded-xl border border-slate-200">
                <!-- Bubbles injected here -->
            </div>
        </div>

        <div id="status-area"
            class="h-24 flex flex-col items-center justify-center transition-all duration-500 opacity-0 transform translate-y-4">
            <div class="text-4xl font-bold text-green-500 mb-4">Stress Level: 0%</div>
            <button onclick="resetBubbles()"
                class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 active:translate-y-0">
                Reset Sheet
            </button>
        </div>
    </main>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const grid = document.getElementById('bubble-grid');
        const statusArea = document.getElementById('status-area');
        const totalBubbles = 36;
        let poppedCount = 0;

        function playPopSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            // Randomize pitch slightly for realism
            oscillator.frequency.setValueAtTime(800 + Math.random() * 200, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function createBubbles() {
            grid.innerHTML = '';
            poppedCount = 0;
            statusArea.classList.remove('opacity-100', 'translate-y-0');
            statusArea.classList.add('opacity-0', 'translate-y-4');

            for (let i = 0; i < totalBubbles; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.onclick = function () {
                    if (!this.classList.contains('popped')) {
                        popBubble(this);
                    }
                };
                grid.appendChild(bubble);
            }
        }

        function popBubble(element) {
            element.classList.add('popped', 'popped-anim');
            playPopSound();
            poppedCount++;

            if (poppedCount === totalBubbles) {
                setTimeout(() => {
                    statusArea.classList.remove('opacity-0', 'translate-y-4');
                    statusArea.classList.add('opacity-100', 'translate-y-0');
                }, 300);
            }
        }

        function resetBubbles() {
            const bubbles = document.querySelectorAll('.bubble');
            bubbles.forEach(b => {
                b.style.transition = 'all 0.3s ease-out';
                b.classList.remove('popped', 'popped-anim');
            });

            statusArea.classList.remove('opacity-100', 'translate-y-0');
            statusArea.classList.add('opacity-0', 'translate-y-4');
            poppedCount = 0;
        }

        // Initialize
        createBubbles();
    </script>
</body>

</html>
